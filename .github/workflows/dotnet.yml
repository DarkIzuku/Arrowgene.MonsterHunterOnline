# Baseline CI for DarkIzuku MHO revival
name: MHO Windows Build

on:
  push:
    branches:
      - master
      - feature/mho-revival-baseline
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Arrowgene.MonsterHunterOnline.sln

      - name: Build solution
        run: dotnet build Arrowgene.MonsterHunterOnline.sln -c Release --no-restore

      - name: Run tests
        continue-on-error: true
        run: dotnet test Arrowgene.MonsterHunterOnline.Test/Arrowgene.MonsterHunterOnline.Test.csproj -c Release --no-build --verbosity normal

      - name: Publish server CLI
        run: dotnet publish Arrowgene.MonsterHunterOnline.Cli/Arrowgene.MonsterHunterOnline.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/server-cli

      - name: Publish UI
        run: dotnet publish Arrowgene.MonsterHunterOnline.UI/Arrowgene.MonsterHunterOnline.UI.csproj -c Release -r win-x64 --self-contained false -o artifacts/ui

      - name: Upload server CLI
        uses: actions/upload-artifact@v4
        with:
          name: MHO-Server-CLI-win-x64
          path: artifacts/server-cli
          if-no-files-found: error

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: MHO-UI-win-x64
          path: artifacts/ui
          if-no-files-found: error
