name: Build MHO Translator

on:
  push:
    branches:
      - feature/mho-translation-tooling
    paths:
      - "Tools/MHOTranslator/**"
      - ".github/workflows/build-mho-translator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish MHOTranslator
        run: dotnet publish Tools/MHOTranslator/MHOTranslator.csproj -c Release -r win-x64 --self-contained true -o artifacts/MHOTranslator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHOTranslator-win-x64
          path: artifacts/MHOTranslator
          if-no-files-found: error
